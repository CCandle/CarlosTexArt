name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    container: texlive/texlive:2024

    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        run: latexmk -xelatex -synctex=1 -interaction=nonstopmode -file-line-error -outdir=build main.tex

      - name: Prepare release assets
        run: |
          VERSION="${GITHUB_REF_NAME}"
          NOTES_FILE=".github/release-notes/${VERSION}.md"

          if [ ! -f "${NOTES_FILE}" ]; then
            echo "Missing release notes: ${NOTES_FILE}"
            exit 1
          fi

          mkdir -p dist
          cp build/main.pdf "dist/CarlosTexArt-${VERSION}-example.pdf"
          python tools/make_starter_package.py --version "${VERSION}" --output "dist/CarlosTexArt-${VERSION}-starter.zip"
          python tools/validate_starter.py "dist/CarlosTexArt-${VERSION}-starter.zip" --compile
          cp "${NOTES_FILE}" dist/release-notes.md

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/CarlosTexArt-${{ github.ref_name }}-example.pdf
            dist/CarlosTexArt-${{ github.ref_name }}-starter.zip
            dist/release-notes.md

  release:
    needs: build-assets
    runs-on: ubuntu-latest

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME}"
          gh release create "${VERSION}" \
            "dist/CarlosTexArt-${VERSION}-example.pdf" \
            "dist/CarlosTexArt-${VERSION}-starter.zip" \
            --title "CarlosTexArt ${VERSION}" \
            --notes-file dist/release-notes.md \
            --latest \
            --repo CCandle/CarlosTexArt
