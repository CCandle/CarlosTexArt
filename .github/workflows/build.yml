name: Build LaTeX

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        run: latexmk -xelatex -synctex=1 -interaction=nonstopmode -file-line-error -outdir=build main.tex

      - name: Build starter package
        run: python tools/make_starter_package.py --version dev --output dist/CarlosTexArt-dev-starter.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CarlosTexArt-build-artifacts
          path: |
            build/main.pdf
            dist/CarlosTexArt-dev-starter.zip
