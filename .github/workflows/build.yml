name: Build LaTeX

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build PDF
        run: latexmk -xelatex -synctex=1 -interaction=nonstopmode -file-line-error -outdir=build main.tex

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarlosTexArt-example
          path: build/main.pdf
